<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Anime Banner">
  <defs>
    <linearGradient id="an-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a52"/>
      <stop offset="0.45" stop-color="#4b2f7a"/>
      <stop offset="0.75" stop-color="#c94f9e"/>
      <stop offset="1" stop-color="#ffd7e8"/>
    </linearGradient>

    <radialGradient id="an-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.4" stop-color="#ffe08a"/>
      <stop offset="0.8" stop-color="#ff9ecb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9ecb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="an-sun2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fff1b8"/>
      <stop offset="1" stop-color="#ffd166"/>
    </radialGradient>

    <linearGradient id="an-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd7e8" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="an-torii" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a3e"/>
      <stop offset="1" stop-color="#120a1e"/>
    </linearGradient>

    <filter id="an-cloud-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="an-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>

    <linearGradient id="an-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffd6ec"/>
      <stop offset="1" stop-color="#e0aaff"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#an-sky)"/>

  <circle cx="870" cy="250" r="200" fill="url(#an-sun)">
    <animate attributeName="r" values="190;215;190" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="250" r="85" fill="url(#an-sun2)"/>

  <g fill="url(#an-cloud)" filter="url(#an-cloud-blur)">
    <g>
      <ellipse cx="0" cy="0" rx="130" ry="34"/>
      <ellipse cx="70" cy="-22" rx="90" ry="30"/>
      <ellipse cx="-80" cy="-14" rx="70" ry="24"/>
      <animateTransform attributeName="transform" type="translate" values="-200,70;200,70;-200,70" dur="40s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="0" rx="110" ry="28"/>
      <ellipse cx="60" cy="-18" rx="75" ry="24"/>
      <ellipse cx="-60" cy="-12" rx="60" ry="20"/>
      <animateTransform attributeName="transform" type="translate" values="200,120;-200,120;200,120" dur="52s" begin="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="0" rx="100" ry="26"/>
      <ellipse cx="55" cy="-16" rx="68" ry="22"/>
      <animateTransform attributeName="transform" type="translate" values="-150,185;150,185;-150,185" dur="34s" begin="2s" repeatCount="indefinite"/>
    </g>
  </g>

  <g fill="#120a1e">
    <path d="M200,352 L200,300 L218,300 L218,352 Z"/>
    <path d="M250,352 L250,300 L268,300 L268,352 Z"/>
    <rect x="186" y="296" width="96" height="14" rx="7"/>
    <rect x="198" y="276" width="72" height="14" rx="7"/>
    <path d="M760,352 L760,300 L778,300 L778,352 Z"/>
    <path d="M808,352 L808,300 L826,300 L826,352 Z"/>
    <rect x="746" y="296" width="94" height="14" rx="7"/>
    <rect x="758" y="276" width="70" height="14" rx="7"/>
  </g>
  <g fill="url(#an-torii)">
    <path d="M60,352 L60,280 L86,280 L86,352 Z"/>
    <path d="M112,352 L112,280 L138,280 L138,352 Z"/>
    <rect x="42" y="264" width="114" height="16" rx="8"/>
    <rect x="56" y="240" width="86" height="14" rx="7"/>
  </g>

  <g fill="#fff6fb">
    <path d="M57,132 l3.2,9.3 9.8,0.3 -7.7,6.1 2.7,9.5 -8,-5.6 -8,5.6 2.7,-9.5 -7.7,-6.1 9.8,-0.3 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.6,0.6;1,1;0.9,0.9;0.6,0.6" dur="3s" repeatCount="indefinite" additive="sum"/>
    </path>
    <path d="M230,90 l2.8,8.2 8.6,0.3 -6.8,5.4 2.4,8.4 -7,-4.9 -7,4.9 2.4,-8.4 -6.8,-5.4 8.6,-0.3 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.4s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.6,0.6;1,1;0.9,0.9;0.6,0.6" dur="3.4s" begin="0.8s" repeatCount="indefinite" additive="sum"/>
    </path>
    <path d="M1050,120 l3.4,10 10.6,0.4 -8.4,6.6 3,10.3 -8.6,-6.1 -8.6,6.1 3,-10.3 -8.4,-6.6 10.6,-0.4 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.8s" begin="1.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.6,0.6;1,1;0.9,0.9;0.6,0.6" dur="3.8s" begin="1.6s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>

  <g fill="#ff8acb">
    <path d="M70,380 c6,-4 10,-2 12,2 c2,-6 8,-8 12,-4 c-6,3 -11,6 -12,12 c-1,-6 -6,-9 -12,-10 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;140;280" dur="7s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="translate" values="-120,-30;0,0; -60,60" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>
  <g fill="#ffa8d8">
    <path d="M1040,70 c5,-3.5 9,-1.8 10.5,1.8 c1.8,-5.3 7,-7 10.5,-3.5 c-5.3,2.6 -9.7,5.3 -10.5,10.5 c-0.9,-5.3 -5.3,-7.9 -10.5,-8.8 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="8.5s" begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;160;300" dur="8.5s" begin="2s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="translate" values="-100,-25;0,0; -50,50" keyTimes="0;0.5;1" dur="8.5s" begin="2s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>
  <g fill="#ff6ec7">
    <path d="M600,-10 c6,-4 10,-2 12,2 c2,-6 8,-8 12,-4 c-6,3 -11,6 -12,12 c-1,-6 -6,-9 -12,-10 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="9s" begin="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;120;240" dur="9s" begin="4s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="translate" values="-80,-20;0,0; -40,40" keyTimes="0;0.5;1" dur="9s" begin="4s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>

  <text x="600" y="218" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="82" font-weight="800" fill="#ffffff" letter-spacing="3" filter="url(#an-glow)">THOMAS</text>
  <text x="600" y="218" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="82" font-weight="800" fill="url(#an-name)" letter-spacing="3">THOMAS</text>
  <text x="600" y="252" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#fff6fb" letter-spacing="7">FULLSTACK DEVELOPER · INDONESIA</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Meteor Banner">
  <defs>
    <linearGradient id="ms-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0414"/>
      <stop offset="0.6" stop-color="#140728"/>
      <stop offset="1" stop-color="#1c0b3c"/>
    </linearGradient>

    <radialGradient id="ms-avatar-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ms-trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ms-trail2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="ms-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <radialGradient id="ms-head" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </radialGradient>
    <radialGradient id="ms-head2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#A855F7"/>
    </radialGradient>

    <clipPath id="ms-avatar-clip">
      <circle cx="600" cy="196" r="76"/>
    </clipPath>

    <linearGradient id="ms-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="ms-name-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#ms-bg)"/>

  <g fill="#ffffff">
    <circle cx="120" cy="60" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="120" r="1.2"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="40" r="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="70" r="1"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="140" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="50" r="0.9"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <circle cx="600" cy="196" r="150" fill="url(#ms-avatar-glow)" filter="url(#ms-soft)">
      <animate attributeName="r" values="110;150;120;150;110" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <image href="https://avatars.githubusercontent.com/u/193677523?v=4" x="519" y="115" width="162" height="162" clip-path="url(#ms-avatar-clip)" preserveAspectRatio="xMidYMid slice"/>

  <circle cx="600" cy="196" r="76" fill="none" stroke="url(#ms-ring)" stroke-width="3">
    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="316" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="2">THOMAS</text>
    <text x="600" y="316" font-size="44" font-weight="800" fill="#22D3EE" filter="url(#ms-name-glow)" letter-spacing="2" opacity="0.75">THOMAS</text>
  </g>
  <text x="600" y="344" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A855F7" letter-spacing="6">FULLSTACK DEVELOPER · INDONESIA</text>

  <g transform="translate(-420,-260)">
    <g>
      <line x1="-160" y1="-120" x2="0" y2="0" stroke="url(#ms-trail)" stroke-width="3"/>
      <circle cx="0" cy="0" r="4.5" fill="url(#ms-head)"/>
      <circle cx="0" cy="0" r="9" fill="url(#ms-head)" opacity="0.4"/>
      <animateTransform attributeName="transform" type="translate"
        values="-420,-260;1100,640;1100,640;-420,-260;-420,-260"
        keyTimes="0;0.12;0.45;0.55;1" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(-600,-150)">
    <g>
      <line x1="-200" y1="-130" x2="0" y2="0" stroke="url(#ms-trail2)" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3.5" fill="url(#ms-head2)"/>
      <animateTransform attributeName="transform" type="translate"
        values="-600,-150;900,560;900,560;-600,-150;-600,-150"
        keyTimes="0;0.1;0.35;0.45;1" dur="7s" begin="2s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(-300,-400)">
    <g>
      <line x1="-120" y1="-100" x2="0" y2="0" stroke="url(#ms-trail)" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="url(#ms-head)"/>
      <animateTransform attributeName="transform" type="translate"
        values="-300,-400;1250,560;1250,560;-300,-400;-300,-400"
        keyTimes="0;0.09;0.3;0.4;1" dur="8s" begin="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <path fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.35" stroke-linecap="round">
    <animate attributeName="d"
      values="M 100 400 C 300 380 500 395 700 385 C 900 375 1050 390 1200 382;
              M 100 400 C 300 412 500 372 700 385 C 900 398 1050 372 1200 382;
              M 100 400 C 300 380 500 395 700 385 C 900 375 1050 390 1200 382"
      dur="8s" repeatCount="indefinite"/>
  </path>
  <path fill="none" stroke="#A855F7" stroke-width="1.5" opacity="0.35" stroke-linecap="round">
    <animate attributeName="d"
      values="M 120 408 C 320 396 520 410 720 400 C 920 390 1070 404 1200 396;
              M 120 408 C 320 420 520 388 720 400 C 920 412 1070 386 1200 396;
              M 120 408 C 320 396 520 410 720 400 C 920 390 1070 404 1200 396"
      dur="10s" begin="1s" repeatCount="indefinite"/>
  </path>
</svg>
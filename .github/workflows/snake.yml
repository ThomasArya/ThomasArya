name: snake

on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ThomasArya
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff9ecb&color_dots=#ffe3f1,#ffc0e0,#ff96cd,#ff66b8,#e23d98
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff9ecb&color_dots=#3a2a4a,#f7a8d8,#f283c4,#e758ab,#c22879
      - uses: crazy-max/ghaction-github-pages@v4
        with: { target_branch: output, build_dir: dist }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}